name: AUR Daily Sync

on:
  schedule:
    - cron: '0 2 * * *'  # 每日 10:00 CST (02:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq curl python3
          # install git config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check python-chinese-calendar (PyPI)
        id: check-pcc
        run: |
          set -e
          PKGDIR="python-chinese-calendar"
          CURRENT=$(grep -Po '^pkgver=\K.*' "$PKGDIR/PKGBUILD" | tr -d '"')
          echo "current python-chinese-calendar: $CURRENT"
          # 从 PyPI 获取最新版本
          UPSTREAM=$(curl -s https://pypi.org/pypi/chinese-calendar/json | jq -r '.info.version')
          echo "upstream python-chinese-calendar: $UPSTREAM"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM" != "$CURRENT" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
          echo "upstream_version=$UPSTREAM" >> $GITHUB_ENV

      - name: Update python-chinese-calendar
        if: steps.check-pcc.outputs.needs_update == 'true'
        run: |
          set -eux
          PKGDIR="python-chinese-calendar"
          VER="${{ steps.check-pcc.outputs.upstream }}"
          echo "Updating $PKGDIR to $VER"

          # 获取 sdist 真实下载 URL 与预期 sha256（从 PyPI json 可信源读取）
          JSON=$(curl -s "https://pypi.org/pypi/chinese-calendar/$VER/json")
          URL=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::未找到 sdist URL"
            exit 1
          fi
          echo "sdist URL: $URL"
          # 计算 sha256（下载校验，若 PyPI 提供 sha256 则直接用更可靠）
          # 优先使用 PyPI 元数据的 sha256，避免重复下载
          EXPECTED_SHA=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" = "null" ]; then
            echo "通过下载计算 sha256..."
            curl -L -o /tmp/pcc.tar.gz "$URL"
            EXPECTED_SHA=$(sha256sum /tmp/pcc.tar.gz | awk '{print $1}')
          fi
          echo "sha256: $EXPECTED_SHA"

          # 更新 PKGBUILD
          # pkgver / pkgrel
          sed -i -E "s/^pkgver=.*/pkgver=$VER/" "$PKGDIR/PKGBUILD"
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" "$PKGDIR/PKGBUILD"
          # source：替换为新 URL，注意转义
          # 统一改为 source=("URL") 形式，避免旧路径 a0/af 哈希失效
          ESCAPED_URL=$(printf '%s\n' "$URL" | sed 's/[\/&]/\\&/g')
          # 若 source 行包含变量，使用 replacement；否则直接替换整行
          sed -i -E "s|^source=.*|source=(\"$URL\")|" "$PKGDIR/PKGBUILD"
          sed -i -E "s/^sha256sums=.*/sha256sums=('$EXPECTED_SHA')/" "$PKGDIR/PKGBUILD"

          echo "=== updated PKGBUILD ==="
          cat "$PKGDIR/PKGBUILD"

      - name: Check curfew (GitHub Tags)
        id: check-curfew
        run: |
          set -e
          PKGDIR="curfew"
          CURRENT=$(grep -Po '^pkgver=\K.*' "$PKGDIR/PKGBUILD" | tr -d '"')
          echo "current curfew: $CURRENT"
          # 从 GitHub API 获取最新 tag，去掉前缀 v
          TAG=$(curl -s -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/aura-deak/Curfew/releases/latest | jq -r '.tag_name // empty')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            # fallback 到 tags 接口
            TAG=$(curl -s https://api.github.com/repos/aura-deak/Curfew/tags?per_page=1 | jq -r '.[0].name')
          fi
          UPSTREAM=${TAG#v}
          echo "upstream curfew tag: $TAG -> version $UPSTREAM"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM" != "$CURRENT" ] && [ -n "$UPSTREAM" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update curfew
        if: steps.check-curfew.outputs.needs_update == 'true'
        run: |
          set -eux
          PKGDIR="curfew"
          VER="${{ steps.check-curfew.outputs.upstream }}"
          echo "Updating $PKGDIR to $VER"
          # 计算新 tarball sha256
          TARBALL_URL="https://github.com/aura-deak/Curfew/archive/refs/tags/v${VER}.tar.gz"
          echo "tarball URL: $TARBALL_URL"
          curl -L --fail -o /tmp/curfew.tar.gz "$TARBALL_URL"
          SHA=$(sha256sum /tmp/curfew.tar.gz | awk '{print $1}')
          echo "sha256: $SHA"

          sed -i -E "s/^pkgver=.*/pkgver=$VER/" "$PKGDIR/PKGBUILD"
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" "$PKGDIR/PKGBUILD"
          # source 行包含 $pkgver 变量，无需改 URL，只需更新 sha256sums
          sed -i -E "s/^sha256sums=.*/sha256sums=('$SHA')/" "$PKGDIR/PKGBUILD"

          echo "=== updated PKGBUILD ==="
          cat "$PKGDIR/PKGBUILD"

      - name: Generate .SRCINFO (via Arch Linux container)
        if: steps.check-pcc.outputs.needs_update == 'true' || steps.check-curfew.outputs.needs_update == 'true'
        run: |
          set -e
          # 使用 archlinux 容器生成 .SRCINFO，确保与 makepkg 行为一致
          # 若 docker 不可用，降级为本地 sed 更新 pkgver/sha
          needs_pcc="${{ steps.check-pcc.outputs.needs_update }}"
          needs_curfew="${{ steps.check-curfew.outputs.needs_update }}"
          for pkg in python-chinese-calendar curfew; do
            need="false"
            if [ "$pkg" = "python-chinese-calendar" ]; then need="$needs_pcc"; else need="$needs_curfew"; fi
            if [ "$need" != "true" ]; then continue; fi
            echo "Generating .SRCINFO for $pkg ..."
            if command -v docker >/dev/null 2>&1; then
              docker run --rm -v "$PWD:/pkg" -w "/pkg/$pkg" archlinux:latest bash -c "
                pacman -Sy --noconfirm --needed base-devel 2>&1 | tail -5
                makepkg --printsrcinfo > .SRCINFO
                cat .SRCINFO
              "
            else
              echo "::warning::docker 不可用，尝试本地生成（可能不完整）"
              # 兜底：直接更新 .SRCINFO 中的 pkgver / sha256
              VER=$(grep -Po '^pkgver=\K.*' "$pkg/PKGBUILD")
              SHA=$(grep -Po "^sha256sums=\('\K[^']+" "$pkg/PKGBUILD")
              if [ -f "$pkg/.SRCINFO" ]; then
                sed -i -E "s/^\s*pkgver = .*/\tpkgver = $VER/" "$pkg/.SRCINFO" || true
                sed -i -E "s|^\s*source =.*|\\tsource = $(grep '^source=' "$pkg/PKGBUILD" | sed 's/source=//')|" "$pkg/.SRCINFO" || true
                sed -i -E "s/^\s*sha256sums = .*/\\tsha256sums = $SHA/" "$pkg/.SRCINFO" || true
              fi
            fi
            cat "$pkg/.SRCINFO"
          done

      - name: Commit & Push
        if: steps.check-pcc.outputs.needs_update == 'true' || steps.check-curfew.outputs.needs_update == 'true'
        run: |
          set -e
          git add python-chinese-calendar/PKGBUILD python-chinese-calendar/.SRCINFO curfew/PKGBUILD curfew/.SRCINFO 2>/dev/null || git add -A
          if git diff --cached --quiet; then
            echo "无变更可提交"
            exit 0
          fi
          MSG="chore(aur): auto bump"
          if [ "${{ steps.check-pcc.outputs.needs_update }}" = "true" ]; then
            MSG="$MSG python-chinese-calendar ${{ steps.check-pcc.outputs.current }} -> ${{ steps.check-pcc.outputs.upstream }}"
          fi
          if [ "${{ steps.check-curfew.outputs.needs_update }}" = "true" ]; then
            # 避免行过长
            if [ "${{ steps.check-pcc.outputs.needs_update }}" = "true" ]; then MSG="$MSG,"; fi
            MSG="$MSG curfew ${{ steps.check-curfew.outputs.current }} -> ${{ steps.check-curfew.outputs.upstream }}"
          fi
          git commit -m "$MSG"
          git push

      # 可选：自动推送到 AUR (aur.archlinux.org)
      # 需在仓库 Settings > Secrets 添加 AUR_SSH_PRIVATE_KEY、AUR_USERNAME
      # 取消下方注释即可启用
      # - name: Push to AUR
      #   if: steps.check-pcc.outputs.needs_update == 'true' || steps.check-curfew.outputs.needs_update == 'true'
      #   env:
      #     AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      #     AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      #   run: |
      #     set -e
      #     mkdir -p ~/.ssh
      #     echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
      #     chmod 600 ~/.ssh/aur
      #     ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
