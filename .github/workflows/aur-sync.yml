name: AUR Daily Sync

on:
  schedule:
    - cron: '0 2 * * *'  # 每日 10:00 CST (02:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq curl python3
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check python-chinese-calendar (PyPI)
        id: check-pcc
        run: |
          set -e
          PKGDIR="python-chinese-calendar"
          CURRENT=$(grep -Po '^pkgver=\K.*' "$PKGDIR/PKGBUILD" | tr -d '"')
          echo "current python-chinese-calendar: $CURRENT"
          JSON=$(curl -s https://pypi.org/pypi/chinese-calendar/json)
          UPSTREAM=$(echo "$JSON" | jq -r '.info.version')
          UPSTREAM_SUMMARY=$(echo "$JSON" | jq -r '.info.summary // empty')
          UPLOAD_TIME=$(echo "$JSON" | jq -r '.urls[0].upload_time // .releases[$UPSTREAM][0].upload_time // empty' 2>/dev/null | head -1)
          echo "upstream python-chinese-calendar: $UPSTREAM"
          echo "summary: $UPSTREAM_SUMMARY"
          echo "upload_time: $UPLOAD_TIME"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT
          echo "summary=$UPSTREAM_SUMMARY" >> $GITHUB_OUTPUT
          echo "upload_time=$UPLOAD_TIME" >> $GITHUB_OUTPUT
          if [ "$UPSTREAM" != "$CURRENT" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi
          # 输出到 Actions Summary（信息里可见版本号）
          {
            echo "### 上游版本信息"
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| 当前 PKGBUILD  | \`$CURRENT\` |"
            echo "| 上游 PyPI      | \`$UPSTREAM\` |"
            echo "| 摘要           | $UPSTREAM_SUMMARY |"
            echo "| 发布时间       | $UPLOAD_TIME |"
            echo "| PyPI 主页      | https://pypi.org/project/chinese-calendar/$UPSTREAM/ |"
            echo "| 需更新         | $([ "$UPSTREAM" != "$CURRENT" ] && echo "是" || echo "否") |"
          } >> $GITHUB_STEP_SUMMARY
          # 写入本地信息文件，供后续提交可见
          mkdir -p "$PKGDIR"
          cat > "$PKGDIR/.upstream.json" <<EOF
          {
            "package": "python-chinese-calendar",
            "current": "$CURRENT",
            "upstream": "$UPSTREAM",
            "summary": "$UPSTREAM_SUMMARY",
            "upload_time": "$UPLOAD_TIME",
            "pypi_url": "https://pypi.org/project/chinese-calendar/$UPSTREAM/",
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat "$PKGDIR/.upstream.json"

      - name: Update python-chinese-calendar
        if: steps.check-pcc.outputs.needs_update == 'true'
        run: |
          set -eux
          PKGDIR="python-chinese-calendar"
          VER="${{ steps.check-pcc.outputs.upstream }}"
          echo "Updating $PKGDIR to $VER"
          JSON=$(curl -s "https://pypi.org/pypi/chinese-calendar/$VER/json")
          URL=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::未找到 sdist URL"
            exit 1
          fi
          echo "sdist URL: $URL"
          EXPECTED_SHA=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          if [ -z "$EXPECTED_SHA" ] || [ "$EXPECTED_SHA" = "null" ]; then
            echo "通过下载计算 sha256..."
            curl -L -o /tmp/pcc.tar.gz "$URL"
            EXPECTED_SHA=$(sha256sum /tmp/pcc.tar.gz | awk '{print $1}')
          fi
          echo "sha256: $EXPECTED_SHA"
          sed -i -E "s/^pkgver=.*/pkgver=$VER/" "$PKGDIR/PKGBUILD"
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" "$PKGDIR/PKGBUILD"
          sed -i -E "s|^source=.*|source=(\"$URL\")|" "$PKGDIR/PKGBUILD"
          sed -i -E "s/^sha256sums=.*/sha256sums=('$EXPECTED_SHA')/" "$PKGDIR/PKGBUILD"
          # 导出供后续 Commit 信息使用
          echo "sdist_url=$URL" >> $GITHUB_ENV
          echo "sdist_sha=$EXPECTED_SHA" >> $GITHUB_ENV
          # 更新 .upstream.json 追加 sdist 信息
          python3 -c "
          import json, os
          p='python-chinese-calendar/.upstream.json'
          d=json.load(open(p))
          d['sdist_url']=os.environ['sdist_url']
          d['sdist_sha256']=os.environ['sdist_sha']
          d['pkgver']=os.environ.get('VER')
          json.dump(d, open(p,'w'), indent=2, ensure_ascii=False)
          print(open(p).read())
          "
          echo "=== updated PKGBUILD ==="
          cat "$PKGDIR/PKGBUILD"
          cat "$PKGDIR/.upstream.json"
          {
            echo "### 更新详情"
            echo "- 上游版本: \`$VER\`"
            echo "- sdist: \`$URL\`"
            echo "- sha256: \`$EXPECTED_SHA\`"
          } >> $GITHUB_STEP_SUMMARY

      - name: Generate .SRCINFO (via Arch Linux container)
        if: steps.check-pcc.outputs.needs_update == 'true'
        run: |
          set -e
          pkg="python-chinese-calendar"
          echo "Generating .SRCINFO for $pkg ..."
          if command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$PWD:/pkg" -w "/pkg/$pkg" archlinux:latest bash -c "
              pacman -Sy --noconfirm --needed base-devel 2>&1 | tail -5
              makepkg --printsrcinfo > .SRCINFO
              cat .SRCINFO
            "
          else
            echo "::warning::docker 不可用，兜底 sed 更新"
            VER=$(grep -Po '^pkgver=\K.*' "$pkg/PKGBUILD")
            SHA=$(grep -Po "^sha256sums=\('\K[^']+" "$pkg/PKGBUILD")
            if [ -f "$pkg/.SRCINFO" ]; then
              sed -i -E "s/^\s*pkgver = .*/\tpkgver = $VER/" "$pkg/.SRCINFO" || true
              sed -i -E "s|^\s*source =.*|\tsource = $(grep '^source=' "$pkg/PKGBUILD" | sed 's/source=//')|" "$pkg/.SRCINFO" || true
              sed -i -E "s/^\s*sha256sums = .*/\tsha256sums = $SHA/" "$pkg/.SRCINFO" || true
            fi
          fi
          cat "$pkg/.SRCINFO"

      - name: Commit & Push
        if: steps.check-pcc.outputs.needs_update == 'true'
        run: |
          set -e
          git add python-chinese-calendar/PKGBUILD python-chinese-calendar/.SRCINFO python-chinese-calendar/.upstream.json
          if git diff --cached --quiet; then
            echo "无变更可提交"
            exit 0
          fi
          MSG="chore(aur): auto bump python-chinese-calendar ${{ steps.check-pcc.outputs.current }} -> ${{ steps.check-pcc.outputs.upstream }}"
          BODY="上游版本: ${{ steps.check-pcc.outputs.upstream }}
          摘要: ${{ steps.check-pcc.outputs.summary }}
          发布时间: ${{ steps.check-pcc.outputs.upload_time }}
          PyPI: https://pypi.org/project/chinese-calendar/${{ steps.check-pcc.outputs.upstream }}/
          sdist: ${{ env.sdist_url }}
          sha256: ${{ env.sdist_sha }}"
          git commit -m "$MSG" -m "$BODY"
          echo "=== Commit 信息 ==="
          git log -1 --stat
          git push

      - name: Push to AUR
        if: steps.check-pcc.outputs.needs_update == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/aur
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pkg="python-chinese-calendar"
          VER="${{ steps.check-pcc.outputs.upstream }}"
          echo "推送 $pkg ($VER) 到 AUR..."
          TMPDIR=$(mktemp -d)
          if ! git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$TMPDIR/$pkg" 2>&1; then
            echo "::warning::clone $pkg 失败，尝试初始化"
            mkdir -p "$TMPDIR/$pkg"
            git -C "$TMPDIR/$pkg" init
            git -C "$TMPDIR/$pkg" remote add origin "ssh://aur@aur.archlinux.org/$pkg.git"
          fi
          cp -v "$pkg/PKGBUILD" "$TMPDIR/$pkg/PKGBUILD"
          cp -v "$pkg/.SRCINFO" "$TMPDIR/$pkg/.SRCINFO"
          if [ -f "$pkg/.gitignore" ]; then cp -v "$pkg/.gitignore" "$TMPDIR/$pkg/.gitignore"; fi
          git -C "$TMPDIR/$pkg" add PKGBUILD .SRCINFO .gitignore 2>/dev/null || git -C "$TMPDIR/$pkg" add PKGBUILD .SRCINFO
          if git -C "$TMPDIR/$pkg" diff --cached --quiet; then
            echo "$pkg 无变更可推送"
            rm -rf "$TMPDIR"
            exit 0
          fi
          git -C "$TMPDIR/$pkg" commit -m "upgpkg: $pkg $VER" -m "upstream $VER | sdist $sdist_url | sha256 $sdist_sha"
          git -C "$TMPDIR/$pkg" push origin HEAD:master
          rm -rf "$TMPDIR"
